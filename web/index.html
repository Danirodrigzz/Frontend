<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>ChinChin Exchange - Intercambio de Criptomonedas</title>
  <meta name="description" content="Plataforma premium de intercambio de criptomonedas con datos en tiempo real.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Pre-cargar fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080B16;
      overflow: hidden;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #080B16 0%, #0D1225 50%, #0E0F2A 100%);
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7C3AED, #8B5CF6, #A78BFA);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.5s ease-in-out infinite;
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.35);
    }

    .loading-logo::after {
      content: "⟳";
      font-size: 36px;
      color: #FAFAFA;
    }

    .loading-text {
      margin-top: 20px;
      color: #94A3B8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="loading-logo"></div>
    <div class="loading-text">CARGANDO...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.4s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    });
  </script>
</body>
</html>
