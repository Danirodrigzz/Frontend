<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>ChinChin Intercambio - Plataforma de Criptomonedas</title>
  <meta name="description" content="Plataforma premium de intercambio de criptomonedas con datos en tiempo real.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/assets/images/logo3.png"/>

  <!-- Pre-cargar fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0E17;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
      background-color: #0A0E17;
      z-index: 1;
    }

    /* Fondo de orbes para profundidad */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      opacity: 0.12;
    }
    .orb-1 {
      width: 400px;
      height: 400px;
      background: #00D4AA;
      top: -150px;
      left: -100px;
      animation: float 12s ease-in-out infinite;
    }
    .orb-2 {
      width: 500px;
      height: 500px;
      background: #00A688;
      bottom: -150px;
      right: -100px;
      animation: float 18s ease-in-out infinite reverse;
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-logo img {
      width: 100%;
      height: 100%;
    }

    .loading-text {
      margin-top: 30px;
      color: #00D4AA;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
      opacity: 0.8;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.05); filter: brightness(1.2); }
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, 60px); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="loading-logo">
      <img src="assets/assets/images/logo3.png" alt="ChinChin Logo">
    </div>
    <div class="loading-text">SINCRONIZANDO MERCADO</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.4s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    });
  </script>
</body>
</html>
