name: chinchin_exchange
description: Plataforma de intercambio de criptomonedas - Prueba técnica Chinchin
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Gestión de estado reactiva
  flutter_riverpod: ^2.6.1

  # Enrutamiento declarativo con guards
  go_router: ^14.8.1

  # Cliente HTTP robusto
  dio: ^5.7.0

  # Almacenamiento local de datos
  shared_preferences: ^2.5.3

  # Gráficos de precios interactivos
  fl_chart: ^0.70.2

  # Animaciones declarativas encadenables
  flutter_animate: ^4.5.2

  # Spinners y loaders animados premium
  flutter_spinkit: ^5.2.1

  # Transiciones de página de Material Design
  animations: ^2.0.11

  # Física de spring para animaciones naturales
  sprung: ^3.0.1

  # Animaciones declarativas simplificadas
  simple_animations: ^5.0.2

  # Animaciones escalonadas para listas y grids
  flutter_staggered_animations: ^1.1.1

  # Tipografías modernas (Inter, JetBrains Mono)
  google_fonts: ^6.2.1

  # Cliente HTTP alternativo (para CORS en web)
  http: ^1.3.0

  # Formateo de fechas y números
  intl: ^0.20.2

  # Comparación eficiente de objetos
  equatable: ^2.0.7

  # Generación de IDs únicos para transacciones
  uuid: ^4.5.1

  # Iconos extendidos
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo3.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/logo3.png"
    background_color: "#0A0E17"
    theme_color: "#00D4AA"

flutter_native_splash:
  color: "#0A0E17"
  image: "assets/images/logo3.png"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/crypto/
    - assets/icons/
